{% extends "budgeting/layout.html" %}
{% load static %}

{% block title %}
Register
{% endblock %}

{% block body %}

<div class="animated-logo logo-auth">
  <span>Cost</span><span>plan</span>
</div>

<div class="auth">

  <form class="auth-form" action="{% url 'register' %}" method="post">
    {% csrf_token %}
    <div class="form-floating">
      <input autofocus class="form-control" type="text" name="username" placeholder="Usuário" required>
      <label>Usuário</label>
    </div>
    <div class="form-floating">
      <input autofocus class="form-control" type="email" name="email" placeholder="Email" required>
      <label>Email</label>
    </div>
    <div class="form-floating">
      <input class="form-control" type="password" name="password" placeholder="Senha" required>
      <label>Senha</label>
    </div>
    <div class="form-floating">
      <input class="form-control" type="password" name="confirmation" placeholder="Confirmar Senha" required>
      <label>Confirmar Senha</label>
    </div>
    {% if message %}
      <div class="alert alert-warning" role="alert">{{ message }}</div>
    {% endif %}

    <button class="btn btn-primary center" type="submit">
      <span class="d-flex align-items-center gap-3">Login<i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i></span>
    </button>
    
  </form>

</div>

<div class="center">
Já possui uma conta?&nbsp;<a href="{% url 'login' %}">Clique aqui.</a>
</div>


{% endblock %}
